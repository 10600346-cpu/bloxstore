<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VoxelCraft</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#menu,
#deathScreen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    color:white;
}

#deathScreen{
    display:none;
}

.panel{
    background:#222;
    padding:35px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 35px #000;
}

.panel h1{
    font-size:42px;
    margin-top:0;
}

button{
    border:0;
    border-radius:8px;
    padding:14px 40px;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    background:#55b83e;
    color:white;
}

button:hover{
    background:#6bd34d;
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:26px;
    text-shadow:0 0 5px black;
}

#status{
    position:absolute;
    left:12px;
    top:12px;
    background:rgba(0,0,0,.5);
    padding:8px 12px;
    border-radius:8px;
    color:white;
    font-size:18px;
    text-shadow:1px 1px 2px black;
}

#health,
#food{
    letter-spacing:2px;
}

#coords{
    font-size:12px;
    margin-top:4px;
}

#hotbar{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
}

.slot{
    width:48px;
    height:48px;
    background:rgba(0,0,0,.7);
    border:2px solid #555;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    position:relative;
}

.slot.selected{
    border:3px solid white;
    box-shadow:0 0 8px white;
}

.blockIcon{
    width:30px;
    height:30px;
}

.number{
    position:absolute;
    right:3px;
    bottom:1px;
    font-size:12px;
}
</style>
</head>

<!-- =========================

========================= -->

<div id="hud">

    <div id="status">

        <div id="health">
            ❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️
        </div>

        <div id="food">
            🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗

        </div>

    </div>


    <div id="crosshair">
        +
    </div>


    <div id="hotbar"></div>

</div>


<!-- =========================
          THREE.JS
========================= -->

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    PointerLockControls
}
from "three/addons/controls/PointerLockControls.js";


/* =====================================================
                    ESCENA
===================================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

scene.fog =
new THREE.Fog(
    0x87ceeb,
    30,
    100
);


/* =====================================================
                    CÁMARA
===================================================== */

const camera =
new THREE.PerspectiveCamera(
    75,
    window.innerWidth /
    window.innerHeight,
    0.05,
    180
);


/*
    La cámara representa la cabeza.
*/

camera.position.set(
    0,
    12,
    10
);


/* =====================================================
                    RENDER
===================================================== */

const renderer =
new THREE.WebGLRenderer({
    antialias:false
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
                    LUCES
===================================================== */

const hemisphere =
new THREE.HemisphereLight(
    0xffffff,
    0x555555,
    2
);

scene.add(
    hemisphere
);


const sun =
new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    30,
    60,
    20
);

sun.castShadow=true;

scene.add(
    sun
);


/* =====================================================
                 PRIMERA PERSONA
===================================================== */

const controls =
new PointerLockControls(
    camera,
    document.body
);

scene.add(
    controls.object
);


/* =====================================================
                    BLOQUES
===================================================== */

const materials = {

    grass:
    new THREE.MeshLambertMaterial({
        color:0x4caf3a
    }),

    dirt:
    new THREE.MeshLambertMaterial({
        color:0x8b5a2b
    }),

    stone:
    new THREE.MeshLambertMaterial({
        color:0x777777
    }),

    wood:
    new THREE.MeshLambertMaterial({
        color:0x9b6638
    }),

    leaves:
    new THREE.MeshLambertMaterial({
        color:0x26852d
    }),

    sand:
    new THREE.MeshLambertMaterial({
        color:0xd9c27a
    })

};


const blockTypes = [
    "grass",
    "dirt",
    "stone",
    "wood",
    "leaves",
    "sand"
];


const blocks =
new Map();

const meshes =
new Map();


function blockKey(x,y,z){

    return (
        x + "," +
        y + "," +
        z
    );

}


/* =====================================================
              CREAR BLOQUE
===================================================== */

function createBlock(
    x,
    y,
    z,
    type
){

    const key =
    blockKey(
        x,
        y,
        z
    );


    if(
        blocks.has(key)
    ){

        return;

    }


    blocks.set(
        key,
        type
    );


    const geometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


    const mesh =
    new THREE.Mesh(
        geometry,
        materials[type]
    );


    mesh.position.set(
        x + .5,
        y + .5,
        z + .5
    );


    mesh.castShadow=true;

    mesh.receiveShadow=true;


    mesh.userData={
        x:x,
        y:y,
        z:z,
        type:type
    };


    scene.add(
        mesh
    );


    meshes.set(
        key,
        mesh
    );

}


/* =====================================================
              BORRAR BLOQUE
===================================================== */

function removeBlock(
    x,
    y,
    z
){

    const key =
    blockKey(
        x,
        y,
        z
    );


    blocks.delete(
        key
    );


    const mesh =
    meshes.get(key);


    if(mesh){

        scene.remove(
            mesh
        );

        mesh.geometry.dispose();

        meshes.delete(
            key
        );

    }

}


/* =====================================================
                  TERRENO
===================================================== */

function getHeight(x,z){

    const a =
    Math.sin(x * .15) * 2;

    const b =
    Math.cos(z * .17) * 2;

    const c =
    Math.sin(
        (x+z) * .08
    ) * 2;

    const height =
    Math.floor(
        5 + a + b + c
    );


    return Math.max(
        1,
        height
    );

}


const WORLD=30;


for(
    let x=-WORLD;
    x<WORLD;
    x++
){

    for(
        let z=-WORLD;
        z<WORLD;
        z++
    ){

        const height =
        getHeight(
            x,
            z
        );


        for(
            let y=0;
            y<=height;
            y++
        ){

            let type =
            "stone";


            if(
                y===height
            ){

                type="grass";

            }
            else if(
                y>=height-2
            ){

                type="dirt";

            }


            createBlock(
                x,
                y,
                z,
                type
            );

        }

    }

}


/* =====================================================
                    ÁRBOLES
===================================================== */

function createTree(
    x,
    z
){

    const ground =
    getHeight(
        x,
        z
    );


    if(
        ground<4
    ){

        return;

    }


    /* Tronco */

    for(
        let y=ground+1;
        y<=ground+4;
        y++
    ){

        createBlock(
            x,
            y,
            z,
            "wood"
        );

    }


    /* Hojas */

    for(
        let dx=-2;
        dx<=2;
        dx++
    ){

        for(
            let dz=-2;
            dz<=2;
            dz++
        ){

            for(
                let dy=3;
                dy<=5;
                dy++
            ){

                const distance =
                Math.abs(dx) +
                Math.abs(dz) +
                (dy===5 ? 1 : 0);


                if(
                    distance<=3
                ){

                    createBlock(
                        x+dx,
                        ground+dy,
                        z+dz,
                        "leaves"
                    );

                }

            }

        }

    }

}


for(
    let x=-25;
    x<25;
    x+=5
){

    for(
        let z=-25;
        z<25;
        z+=5
    ){

        if(
            Math.random() < .28 &&
            Math.hypot(x,z)>7
        ){

            createTree(
                x,
                z
            );

        }

    }

}


/* =====================================================
                JUGADOR
===================================================== */

const PLAYER_WIDTH =
0.58;

const PLAYER_HEIGHT =
1.8;

const PLAYER_RADIUS =
PLAYER_WIDTH / 2;


/*
    Cámara = cabeza.

    Pies = cámara - 1.8
*/


function getPlayerBox(
    position
){

    return {

        minX:
        position.x -
        PLAYER_RADIUS +
        0.001,

        maxX:
        position.x +
        PLAYER_RADIUS -
        0.001,

        minY:
        position.y -
        PLAYER_HEIGHT +
        0.001,

        maxY:
        position.y -
        0.001,

        minZ:
        position.z -
        PLAYER_RADIUS +
        0.001,

        maxZ:
        position.z +
        PLAYER_RADIUS -
        0.001

    };

}


/* =====================================================
             COLISIÓN REAL
===================================================== */

function playerCollides(
    position
){

    const box =
    getPlayerBox(
        position
    );


    const minX =
    Math.floor(
        box.minX
    );

    const maxX =
    Math.floor(
        box.maxX
    );


    const minY =
    Math.floor(
        box.minY
    );

    const maxY =
    Math.floor(
        box.maxY
    );


    const minZ =
    Math.floor(
        box.minZ
    );

    const maxZ =
    Math.floor(
        box.maxZ
    );


    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let y=minY;
            y<=maxY;
            y++
        ){

            for(
                let z=minZ;
                z<=maxZ;
                z++
            ){

                if(
                    !blocks.has(
                        blockKey(
                            x,
                            y,
                            z
                        )
                    )
                ){

                    continue;

                }


                /*
                    Caja del bloque.
                */

                const blockMinX=x;
                const blockMaxX=x+1;

                const blockMinY=y;
                const blockMaxY=y+1;

                const blockMinZ=z;
                const blockMaxZ=z+1;


                /*
                    Intersección REAL.
                */

                if(

                    box.maxX >
                    blockMinX &&

                    box.minX <
                    blockMaxX &&

                    box.maxY >
                    blockMinY &&

                    box.minY <
                    blockMaxY &&

                    box.maxZ >
                    blockMinZ &&

                    box.minZ <
                    blockMaxZ

                ){

                    return true;

                }

            }

        }

    }


    return false;

}


/* =====================================================
          MOVIMIENTO ANTI-ATRAVESAR
===================================================== */

function movePlayer(
    dx,
    dy,
    dz
){

    const player =
    controls.object.position;


    /*
        Dividimos el movimiento en pasos pequeños.

        Esto evita atravesar bloques.
    */

    const distance =
    Math.max(
        Math.abs(dx),
        Math.abs(dy),
        Math.abs(dz)
    );


    const steps =
    Math.max(
        1,
        Math.ceil(
            distance / 0.04
        )
    );


    const stepX =
    dx / steps;

    const stepY =
    dy / steps;

    const stepZ =
    dz / steps;


    let hitGround=false;


    for(
        let i=0;
        i<steps;
        i++
    ){

        /* =========================
                    X
        ========================= */

        if(
            stepX!==0
        ){

            const test =
            player.clone();


            test.x +=
            stepX;


            if(
                !playerCollides(
                    test
                )
            ){

                player.x =
                test.x;

            }

        }


        /* =========================
                    Z
        ========================= */

        if(
            stepZ!==0
        ){

            const test =
            player.clone();


            test.z +=
            stepZ;


            if(
                !playerCollides(
                    test
                )
            ){

                player.z =
                test.z;

            }

        }


        /* =========================
                    Y
        ========================= */

        if(
            stepY!==0
        ){

            const test =
            player.clone();


            test.y +=
            stepY;


            if(
                !playerCollides(
                    test
                )
            ){

                player.y =
                test.y;

            }
            else{

                if(
                    stepY<0
                ){

                    hitGround=true;

                }


                velocityY=0;

                break;

            }

        }

    }


    if(
        dy<0 &&
        hitGround
    ){

        grounded=true;

    }

}


/* =====================================================
                MOVIMIENTO
===================================================== */

const keys={};

let velocityY=0;

let grounded=false;

const SPEED=6;

const GRAVITY=22;

const JUMP=8.5;


/* =====================================================
                 TECLADO
===================================================== */

window.addEventListener(
    "keydown",
    event=>{

        keys[event.code]=true;


        if(
            event.code==="Space"
        ){

            event.preventDefault();


            if(
                grounded &&
                !dead
            ){

                velocityY=
                JUMP;

                grounded=false;

            }

        }

    }
);


window.addEventListener(
    "keyup",
    event=>{

        keys[event.code]=false;

    }
);


/* =====================================================
              VIDA Y COMIDA
===================================================== */

let health=10;

let food=10;

let dead=false;

let hungerTimer=0;


/*
    Cada 15 segundos baja 1 comida.
*/

const HUNGER_TIME=15;


function updateHUD(){

    let hearts="";

    for(
        let i=0;
        i<10;
        i++
    ){

        if(
            i<health
        ){

            hearts+="❤️";

        }
        else{

            hearts+="🖤";

        }

    }


    let foodIcons="";

    for(
        let i=0;
        i<10;
        i++
    ){

        if(
            i<food
        ){

            foodIcons+="🍗";

        }
        else{

            foodIcons+="🖤";

        }

    }


    document.getElementById(
        "health"
    ).textContent=
    hearts;


    document.getElementById(
        "food"
    ).textContent=
    foodIcons;

}


updateHUD();


function damage(
    amount,
    reason
){

    if(dead)
        return;


    health -=
    amount;


    health =
    Math.max(
        0,
        health
    );


    updateHUD();


    if(
        health<=0
    ){

        die(
            reason
        );

    }

}


function die(
    reason
){

    dead=true;

    controls.unlock();


    document.getElementById(
        "deathReason"
    ).textContent=
    reason;


    document.getElementById(
        "deathScreen"
    ).style.display=
    "flex";

}


function respawn(){

    dead=false;

    health=10;

    food=10;

    hungerTimer=0;


    /*
        Aparecer sobre el terreno.
    */

    const spawnX=0;

    const spawnZ=10;

    const ground =
    getHeight(
        spawnX,
        spawnZ
    );


    controls.object.position.set(
        spawnX+.5,
        ground+
        PLAYER_HEIGHT+
        .05,
        spawnZ+.5
    );


    velocityY=0;

    grounded=true;


    updateHUD();


    document.getElementById(
        "deathScreen"
    ).style.display=
    "none";


    controls.lock();

}


/* =====================================================
             COMER AUTOMÁTICAMENTE
===================================================== */

/*
    Para probar el sistema puedes presionar F.

    F = comer y recuperar comida.
*/

window.addEventListener(
    "keydown",
    event=>{

        if(
            event.code==="KeyF" &&
            !dead
        ){

            if(
                food<10
            ){

                food++;

                updateHUD();

            }

        }

    }
);


/* =====================================================
            ROMPER / COLOCAR
===================================================== */

const raycaster =
new THREE.Raycaster();


let selectedBlock=0;


function getTargetBlock(){

    raycaster.setFromCamera(
        new THREE.Vector2(
            0,
            0
        ),
        camera
    );


    const objects =
    Array.from(
        meshes.values()
    );


    const hits =
    raycaster.intersectObjects(
        objects,
        false
    );


    if(
        hits.length>0 &&
        hits[0].distance<7
    ){

        return hits[0];

    }


    return null;

}


window.addEventListener(
    "mousedown",
    event=>{

        if(
            !controls.isLocked ||
            dead
        ){

            return;

        }


        const hit =
        getTargetBlock();


        if(!hit)
            return;


        const block =
        hit.object.userData;


        /* =========================
                ROMPER
        ========================= */

        if(
            event.button===0
        ){

            /*
                No permitir romper
                el bloque debajo del jugador.
            */

            const px =
            Math.floor(
                camera.position.x
            );

            const py =
            Math.floor(
                camera.position.y -
                PLAYER_HEIGHT
            );

            const pz =
            Math.floor(
                camera.position.z
            );


            if(
                block.x===px &&
                block.z===pz &&
                block.y<=py
            ){

                return;

            }


            removeBlock(
                block.x,
                block.y,
                block.z
            );

        }


        /* =========================
                COLOCAR
        ========================= */

        if(
            event.button===2
        ){

            const normal =
            hit.face.normal;


            const x =
            block.x+
            Math.round(
                normal.x
            );


            const y =
            block.y+
            Math.round(
                normal.y
            );


            const z =
            block.z+
            Math.round(
                normal.z
            );


            const key =
            blockKey(
                x,
                y,
                z
            );


            if(
                blocks.has(key)
            ){

                return;

            }


            /*
                Comprobar que el bloque
                nuevo no aparece dentro
                del jugador.
            */

            const player =
            controls.object.position;


            const testPosition =
            player.clone();


            /*
                Comprobar con el nuevo
                bloque temporalmente.
            */

            blocks.set(
                key,
                blockTypes[
                    selectedBlock
                ]
            );


            const collision =
            playerCollides(
                testPosition
            );


            blocks.delete(
                key
            );


            if(
                !collision
            ){

                createBlock(
                    x,
                    y,
                    z,
                    blockTypes[
                        selectedBlock
                    ]
                );

            }

        }

    }
);


window.addEventListener(
    "contextmenu",
    event=>{
        event.preventDefault();
    }
);


/* =====================================================
                    HOTBAR
===================================================== */

const hotbar =
document.getElementById(
    "hotbar"
);


const blockColors=[
    "#4caf3a",
    "#8b5a2b",
    "#777777",
    "#9b6638",
    "#26852d",
    "#d9c27a"
];


blockTypes.forEach(
    (type,index)=>{

        const slot =
        document.createElement(
            "div"
        );


        slot.className=
        "slot";


        const icon =
        document.createElement(
            "div"
        );


        icon.className=
        "blockIcon";


        icon.style.background=
        blockColors[index];


        const number =
        document.createElement(
            "div"
        );


        number.className=
        "number";


        number.textContent=
        index+1;


        slot.appendChild(
            icon
        );


        slot.appendChild(
            number
        );


        hotbar.appendChild(
            slot
        );

    }
);


function selectBlock(
    index
){

    selectedBlock=index;


    Array.from(
        hotbar.children
    ).forEach(
        (slot,i)=>{

            slot.classList.toggle(
                "selected",
                i===index
            );

        }
    );

}


selectBlock(0);


window.addEventListener(
    "keydown",
    event=>{

        if(
            event.code.startsWith(
                "Digit"
            )
        ){

            const number =
            Number(
                event.code.substring(5)
            );


            if(
                number>=1 &&
                number<=6
            ){

                selectBlock(
                    number-1
                );

            }

        }

    }
);


/* =====================================================
                  BOTÓN JUGAR
===================================================== */

document.getElementById(
    "playButton"
).addEventListener(
    "click",
    ()=>{
        controls.lock();
    }
);


document.getElementById(
    "respawnButton"
).addEventListener(
    "click",
    ()=>{
        respawn();
    }
);


controls.addEventListener(
    "lock",
    ()=>{

        if(!dead){

            document.getElementById(
                "menu"
            ).style.display=
            "none";

        }

    }
);


controls.addEventListener(
    "unlock",
    ()=>{

        if(!dead){

            document.getElementById(
                "menu"
            ).style.display=
            "flex";

        }

    }
);


/* =====================================================
                  CICLO DÍA/NOCHE
===================================================== */

let worldTime=0;


/* =====================================================
                    ANIMACIÓN
===================================================== */

const clock =
new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
    Math.min(
        clock.getDelta(),
        .05
    );


    if(
        controls.isLocked &&
        !dead
    ){

        /* =========================
              MOVIMIENTO WASD
        ========================= */

        let forward=0;

        let side=0;


        if(keys.KeyW)
            forward+=1;

        if(keys.KeyS)
            forward-=1;

        if(keys.KeyA)
            side-=1;

        if(keys.KeyD)
            side+=1;


        const direction =
        new THREE.Vector3();


        camera.getWorldDirection(
            direction
        );


        direction.y=0;


        if(
            direction.length()>0
        ){

            direction.normalize();

        }


        const right =
        new THREE.Vector3();


        right.crossVectors(
            direction,
            camera.up
        );


        right.normalize();


        const movement =
        new THREE.Vector3();


        movement.addScaledVector(
            direction,
            forward
        );


        movement.addScaledVector(
            right,
            side
        );


        if(
            movement.length()>0
        ){

            movement.normalize();

        }


        movement.multiplyScalar(
            SPEED*delta
        );


        /* =========================
                 GRAVEDAD
        ========================= */

        velocityY -=
        GRAVITY*delta;


        const dy =
        velocityY*delta;


        grounded=false;


        movePlayer(
            movement.x,
            dy,
            movement.z
        );


        /* =========================
                CAER AL VACÍO
        ========================= */

        if(
            camera.position.y < -15
        ){

            damage(
                10,
                "Caíste al vacío."
            );

        }


        /* =========================
                  HAMBRE
        ========================= */

        hungerTimer +=
        delta;


        if(
            hungerTimer>=
            HUNGER_TIME
        ){

            hungerTimer=0;


            if(
                food>0
            ){

                food--;

                updateHUD();

            }


            /*
                Cuando llega exactamente
                a 0, muere.
            */

            if(
                food<=0
            ){

                die(
                    "Te quedaste sin comida."
                );

            }

        }


        /* =========================
                 COORDENADAS
        ========================= */

        document.getElementById(
            "coords"
        ).textContent=
        Math.floor(
            camera.position.x
        )+
        " "+
        Math.floor(
            camera.position.y
        )+
        " "+
        Math.floor(
            camera.position.z
        );

    }


    /* =================================================
                   DÍA / NOCHE
    ================================================= */

    worldTime +=
    delta*.015;


    const sunX =
    Math.cos(
        worldTime
    )*50;


    const sunY =
    Math.sin(
        worldTime
    )*60+15;


    sun.position.set(
        sunX,
        sunY,
        20
    );


    const daylight =
    Math.max(
        .18,
        Math.sin(
            worldTime
        )*.5+.5
    );


    scene.background.setHSL(
        .58,
        .65,
        .42*daylight+.18
    );


    scene.fog.color.copy(
        scene.background
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
                    RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
        window.innerWidth /
        window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
