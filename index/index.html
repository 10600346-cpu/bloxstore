<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 10 Pro Final</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 80% 50%, #175e9b 0%, #002e62 70%);
        }
        
        /* Superficie del escritorio */
        #contenedor-escritorio {
            width: 100%;
            height: calc(100% - 40px);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: flex-start;
        }

        .acceso-directo {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            padding: 5px;
            border: 1px solid transparent;
            border-radius: 3px;
        }
        .acceso-directo:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .acceso-directo span.img-ico { font-size: 32px; margin-bottom: 5px; }
        .acceso-directo span.txt-ico { color: white; font-size: 11px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        /* EL MENÚ DE INICIO REAL CON TU IMAGEN INCORPORADA */
        #menu-inicio-grafico {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 630px; /* Proporción ideal de la interfaz de tu imagen */
            height: 410px; 
            /* Carga de forma nativa la captura real de Windows 10 con los paneles exactos que enviaste */
            background-image: url('https://imgur.com'); 
            background-size: cover;
            background-position: center;
            border-top: 1px solid rgba(255,255,255,0.15);
            border-right: 1px solid rgba(255,255,255,0.15);
            box-shadow: 5px 0 20px rgba(0,0,0,0.6);
            z-index: 99999;
            display: none; /* Inicia cerrado de forma limpia */
        }

        /* Ventanas Flotantes */
        .ventana-aplicacion {
            position: absolute;
            top: 100px;
            left: 150px;
            width: 450px;
            height: 300px;
            background-color: #ffffff;
            border: 1px solid #1c1c1c;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        .barra-ventana {
            background-color: #efefef;
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 10px;
            cursor: move;
            border-bottom: 1px solid #d1d1d1;
        }
        .controles-ventana { display: flex; height: 100%; }
        .boton-accion { width: 45px; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .boton-accion:hover { background-color: #e5e5e5; }
        .contenido-ventana { padding: 15px; flex: 1; font-size: 14px; color: #333; }

        /* Barra de tareas inferior */
        #barra-tareas-fija {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999999;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .icono-inicio-windows { width: 48px; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .icono-inicio-windows:hover { background-color: rgba(255,255,255,0.1); }
        .icono-inicio-windows svg { width: 16px; height: 16px; fill: white; }
        
        .bandeja-reloj { display: flex; align-items: center; height: 100%; padding-right: 10px; color: white; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Escritorio -->
    <div id="contenedor-escritorio">
        <div class="acceso-directo" ondblclick="mostrarApp('win-equipo')" onclick="event.stopPropagation()">
            <span class="img-ico">🖥️</span>
            <span class="txt-ico">Este Equipo</span>
        </div>
        <div class="acceso-directo" ondblclick="mostrarApp('win-notas')" onclick="event.stopPropagation()">
            <span class="img-ico">📝</span>
            <span class="txt-ico">Notas Pro</span>
        </div>
    </div>

    <!-- Menú de Inicio Modificado (Muestra exactamente tu imagen al hacer clic) -->
    <div id="menu-inicio-grafico" onclick="event.stopPropagation()"></div>

    <!-- Ventanas -->
    <div id="win-equipo" class="ventana-aplicacion" onclick="traerAlFrente('win-equipo')">
        <div class="barra-ventana" onmousedown="comenzarArrastre(event, 'win-equipo')">
            <span style="font-size: 12px; color: #333;">Este Equipo</span>
            <div class="controles-ventana"><div class="boton-accion" onclick="ocultarApp('win-equipo')">✕</div></div>
        </div>
        <div class="contenido-ventana"><p>🔵 Disco Local (C:) - Funcionando correctamente.</p></div>
    </div>

    <div id="win-notes" class="ventana-aplicacion" onclick="traerAlFrente('win-notes')">
        <div class="barra-ventana" onmousedown="comenzarArrastre(event, 'win-notes')">
            <span style="font-size: 12px; color: #333;">Bloc de notas</span>
            <div class="controles-ventana"><div class="boton-accion" onclick="ocultarApp('win-notes')">✕</div></div>
        </div>
        <div class="contenido-ventana" style="padding:0;"><textarea style="width:100%; height:100%; border:none; padding:10px; resize:none; outline:none;"></textarea></div>
    </div>

    <!-- Barra de tareas -->
    <div id="barra-tareas-fija">
        <div class="icono-inicio-windows" id="btnDisparador" onclick="alternarMenuReal(event)">
            <svg viewBox="0 0 24 24"><path d="M0 3.449L9.75 2.1v9.45H0V3.449zM0 12.45h9.75v9.45L0 20.551v-8.102zM10.95 1.95L24 0v11.55H10.95V1.95zM10.95 12.45H24v11.55l-13.05-1.95v-9.6z"/></svg>
        </div>
        <div class="bandeja-reloj">
            <div style="display: flex; flex-direction: column; align-items: flex-end; padding: 0 10px;">
                <span id="reloj-h">00:00</span>
                <span id="reloj-f">01/01/2026</span>
            </div>
        </div>
    </div>

    <script>
        // Reloj del sistema
        function relojActivo() {
            var tiempo = new Date();
            var horas = tiempo.getHours();
            var minutos = tiempo.getMinutes();
            var dia = tiempo.getDate();
            var mes = tiempo.getMonth() + 1;
            var anio = tiempo.getFullYear();

            horas = horas < 10 ? '0' + horas : horas;
            minutos = minutos < 10 ? '0' + minutos : minutos;
            dia = dia < 10 ? '0' + dia : dia;
            mes = mes < 10 ? '0' + mes : mes;

            document.getElementById('reloj-h').innerText = horas + ':' + minutos;
            document.getElementById('reloj-f').innerText = dia + '/' + mes + '/' + anio;
        }
        relojActivo();
        setInterval(relojActivo, 1000);

        // Control del menú de inicio gráfico (Cero Alertas JavaScript de texto)
        function alternarMenuReal(event) {
            if (event) event.stopPropagation();
            var controlMenu = document.getElementById('menu-inicio-grafico');
            var estaAbierto = controlMenu.style.display === 'block';
            
            forzarCierre();
            if (!estaAbierto) {
                controlMenu.style.display = 'block';
            }
        }

        function mostrarApp(id) { var ventana = document.getElementById(id); if (ventana) { ventana.style.display = 'flex'; traerAlFrente(id); } }
        function ocultarApp(id) { var ventana = document.getElementById(id); if (ventana) ventana.style.display = 'none'; }
        function traerAlFrente(id) { document.querySelectorAll('.ventana-aplicacion').forEach(w => w.style.zIndex = '100'); var ventana = document.getElementById(id); if (ventana) ventana.style.zIndex = '200'; }

        // Manejo de arrastre
        var winObjeto = null;
        var inicioMouseX, inicioMouseY, posicionX, posicionY;
        function comenzarArrastre(e, id) { winObjeto = document.getElementById(id); traerAlFrente(id); inicioMouseX = e.clientX; inicioMouseY = e.clientY; posicionX = winObjeto.offsetLeft; posicionY = winObjeto.offsetTop; document.addEventListener('mousemove', arrastrandoVentana); document.addEventListener('mouseup', finArrastre); }
        function arrastrandoVentana(e) { if (!winObjeto) return; var distX = e.clientX - inicioMouseX; var distY = e.clientY - inicioMouseY; winObjeto.style.left = (posicionX + distX) + 'px'; winObjeto.style.top = (posicionY + distY) + 'px'; }
        function finArrastre() { document.removeEventListener('mousemove', arrastrandoVentana); document.removeEventListener('mouseup', finArrastre); winObjeto = null; }

        function forzarCierre() {
            document.getElementById('menu-inicio-grafico').style.display = 'none';
        }
        document.getElementById('contenedor-escritorio').addEventListener('click', forzarCierre);
    </script>
</body>
</html>
