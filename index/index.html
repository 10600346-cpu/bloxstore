<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 10 Pro Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 80% 50%, #175e9b 0%, #002e62 70%);
        }
        
        /* Contenedor del Escritorio */
        #desktop {
            width: 100%;
            height: calc(100% - 40px);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: flex-start;
        }

        /* Iconos del Escritorio */
        .desktop-icon {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            padding: 5px;
            border: 1px solid transparent;
            border-radius: 3px;
        }
        .desktop-icon:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .desktop-icon span.icon-img { font-size: 32px; margin-bottom: 5px; }
        .desktop-icon span.icon-text { color: white; font-size: 11px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        /* MENÚ DE INICIO REAL DE WINDOWS 10 (Estilo Mosaico) */
        #start-menu {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 620px;
            height: 500px;
            background-color: rgba(25, 25, 25, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 10000;
            display: none; 
            grid-template-columns: 45px 225px 1fr;
        }

        /* Columna izquierda de iconos mínimos */
        .start-sidebar {
            background-color: rgba(10, 10, 10, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10px;
            gap: 15px;
        }
        .sidebar-icon { color: #ccc; font-size: 18px; cursor: pointer; padding: 10px; width: 100%; text-align: center; }
        .sidebar-icon:hover { background-color: rgba(255,255,255,0.1); color: white; }

        /* Lista central de programas */
        .start-apps-list {
            padding: 15px 10px;
            overflow-y: auto;
            color: #ddd;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .app-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px;
            cursor: pointer;
            border-radius: 2px;
        }
        .app-item:hover { background-color: rgba(255,255,255,0.1); }

        /* Paneles de Mosaicos de la Derecha (Tiles de Windows 10) */
        .start-tiles-grid {
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 90px;
            gap: 8px;
        }
        .tile {
            background-color: #0078d7;
            color: white;
            padding: 10px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .tile:hover { filter: brightness(1.1); }
        .tile.wide { grid-column: span 2; background-color: #d83b01; }
        .tile.green { background-color: #107c41; }
        .tile-icon { font-size: 24px; }

        /* Ventanas Interactivas */
        .window {
            position: absolute;
            top: 80px;
            left: 120px;
            width: 450px;
            height: 300px;
            background-color: #ffffff;
            border: 1px solid #1c1c1c;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        .window-header {
            background-color: #efefef;
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 10px;
            cursor: move;
            border-bottom: 1px solid #d1d1d1;
        }
        .window-controls { display: flex; height: 100%; }
        .win-btn { width: 45px; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .win-btn:hover { background-color: #e5e5e5; }
        .window-content { padding: 15px; flex: 1; font-size: 14px; color: #333; }

        /* Barra de tareas inferior */
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .start-btn { width: 48px; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .start-btn:hover { background-color: rgba(255,255,255,0.1); }
        .start-btn svg { width: 16px; height: 16px; fill: white; }
        
        .system-tray { display: flex; align-items: center; height: 100%; padding-right: 10px; color: white; font-size: 12px; }
        .clock-widget { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding: 0 10px; height: 100%; }
    </style>
</head>
<body>

    <!-- Escritorio -->
    <div id="desktop">
        <div class="desktop-icon" ondblclick="ejecutarVentana('win-pc')" onclick="event.stopPropagation()">
            <span class="icon-img">🖥️</span>
            <span class="icon-text">Este Equipo</span>
        </div>
        <div class="desktop-icon" ondblclick="ejecutarVentana('win-notes')" onclick="event.stopPropagation()">
            <span class="icon-img">📝</span>
            <span class="icon-text">Notas Pro</span>
        </div>
    </div>

    <!-- Menú de Inicio de Mosaicos Reales (Sin Alertas JavaScript) -->
    <div id="start-menu" onclick="event.stopPropagation()">
        <!-- Barra de opciones -->
        <div class="start-sidebar">
            <div class="sidebar-icon">👤</div>
            <div class="sidebar-icon">⚙️</div>
            <div class="sidebar-icon" onclick="location.reload()">🔄</div>
        </div>

        <!-- Lista Central de Apps -->
        <div class="start-apps-list">
            <div style="color: #888; font-size: 11px; font-weight: bold; padding: 0 5px 5px 5px;">Más usadas</div>
            <div class="app-item" onclick="ejecutarVentana('win-pc'); limpiarEscritorio();"><span>🖥️ Este Equipo</span></div>
            <div class="app-item" onclick="ejecutarVentana('win-notes'); limpiarEscritorio();"><span>📝 Notas Pro</span></div>
            <div class="app-item"><span>🌐 Google Chrome</span></div>
            <div class="app-item"><span>📁 Explorador de archivos</span></div>
        </div>

        <!-- Cuadrícula de Mosaicos Gráficos -->
        <div class="start-tiles-grid">
            <div class="tile wide">
                <span class="tile-icon">📅</span>
                <span>Calendario de Outlook</span>
            </div>
            <div class="tile green">
                <span class="tile-icon">🍬</span>
                <span>Candy Crush</span>
            </div>
            <div class="tile">
                <span class="tile-icon">☀️</span>
                <span>El Tiempo - 24°</span>
            </div>
            <div class="tile">
                <span class="tile-icon">🛍️</span>
                <span>Microsoft Store</span>
            </div>
        </div>
    </div>

    <!-- Ventanas del Sistema -->
    <div id="win-pc" class="window" onclick="enfocarVentana('win-pc')">
        <div class="window-header" onmousedown="iniciarArrastre(event, 'win-pc')">
            <span style="font-size: 12px; color: #333;">Este Equipo</span>
            <div class="window-controls"><div class="win-btn" onclick="cerrarVentana('win-pc')">✕</div></div>
        </div>
        <div class="window-content"><p>🔵 Disco Local (C:) - Simulación activa</p></div>
    </div>

    <div id="win-notes" class="window" onclick="enfocarVentana('win-notes')">
        <div class="window-header" onmousedown="iniciarArrastre(event, 'win-notes')">
            <span style="font-size: 12px; color: #333;">Bloc de notas</span>
            <div class="window-controls"><div class="win-btn" onclick="cerrarVentana('win-notes')">✕</div></div>
        </div>
        <div class="window-content" style="padding:0;"><textarea style="width:100%; height:100%; border:none; padding:10px; resize:none;"></textarea></div>
    </div>

    <!-- Barra de tareas -->
    <div id="taskbar">
        <div class="start-btn" id="startBtn" onclick="conmutarMenuInicio(event)">

        </div>
