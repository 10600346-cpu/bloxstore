<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VoxelCraft</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#menu,#death{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.75);
    color:white;
}

#death{
    display:none;
}

.panel{
    background:#222;
    padding:35px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 30px #000;
}

.panel h1{
    font-size:42px;
    margin:0 0 20px;
}

button{
    padding:14px 40px;
    border:0;
    border-radius:8px;
    background:#4caf3a;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#status{
    position:absolute;
    top:10px;
    left:10px;
    padding:8px 12px;
    background:rgba(0,0,0,.5);
    border-radius:8px;
    color:white;
    font-size:20px;
    text-shadow:1px 1px 3px black;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    text-shadow:0 0 4px black;
}

#hotbar{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
}

.slot{
    width:48px;
    height:48px;
    background:rgba(0,0,0,.7);
    border:2px solid #555;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    position:relative;
}

.slot.selected{
    border:3px solid white;
}

.blockIcon{
    width:30px;
    height:30px;
    background:#8b5a2b;
}

.num{
    position:absolute;
    right:3px;
    bottom:1px;
    font-size:12px;
}
</style>
</head>

<body>

<div id="menu">
    <div class="panel">
        <h1>🌍 VoxelCraft</h1>
        <p>WASD — Mover</p>
        <p>Mouse — Mirar</p>
        <p>ESPACIO — Saltar</p>
        <p>Click izquierdo — Romper</p>
        <p>Click derecho — Colocar</p>
        <p>1 — Bloque de tierra</p>
        <br>
        <button id="play">JUGAR</button>
    </div>
</div>

<div id="death">
    <div class="panel">
        <h1>💀 MORISTE</h1>
        <p id="reason">Te quedaste sin comida.</p>
        <button id="respawn">REAPARECER</button>
    </div>
</div>

<div id="hud">
    <div id="status">
        <div id="health">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
        <div id="food">🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗</div>
        <div id="coords">0 0 0</div>
    </div>

    <div id="crosshair">+</div>
    <div id="hotbar"></div>
</div>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import {
    PointerLockControls
} from "three/addons/controls/PointerLockControls.js";


/* =====================================================
                    ESCENA
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        25,
        100
    );


/* =====================================================
                    CÁMARA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.05,
        150
    );

camera.position.set(
    0,
    3,
    8
);


/* =====================================================
                   RENDERIZADO
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:false
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
                       LUZ
===================================================== */

const light =
    new THREE.HemisphereLight(
        0xffffff,
        0x555555,
        2
    );

scene.add(light);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    30,
    50,
    20
);

sun.castShadow = true;

scene.add(sun);


/* =====================================================
                CONTROLES DE CÁMARA
===================================================== */

const controls =
    new PointerLockControls(
        camera,
        document.body
    );


/* =====================================================
                     BLOQUES
===================================================== */

/*
    IMPORTANTE:

    Ahora SOLO existe un tipo de bloque:
    TIERRA.

    No hay bloques verdes.
*/

const dirtMaterial =
    new THREE.MeshLambertMaterial({
        color:0x8b5a2b
    });


const blockGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


const blocks =
    new Map();

const meshes =
    new Map();


function blockKey(x,y,z){

    return x + "," + y + "," + z;

}


function createBlock(
    x,
    y,
    z
){

    const key =
        blockKey(x,y,z);

    if(
        blocks.has(key)
    ){
        return;
    }

    blocks.set(
        key,
        "dirt"
    );

    const mesh =
        new THREE.Mesh(
            blockGeometry,
            dirtMaterial
        );

    mesh.position.set(
        x + 0.5,
        y + 0.5,
        z + 0.5
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    mesh.userData = {
        x:x,
        y:y,
        z:z
    };

    scene.add(mesh);

    meshes.set(
        key,
        mesh
    );
}


function removeBlock(
    x,
    y,
    z
){

    const key =
        blockKey(x,y,z);

    const mesh =
        meshes.get(key);

    if(mesh){

        scene.remove(mesh);

        meshes.delete(key);

    }

    blocks.delete(key);
}


/* =====================================================
                   MUNDO PLANO
===================================================== */

/*
    Todo el mundo es tierra.

    Y=0 es el suelo.
*/

const WORLD_SIZE = 35;

for(
    let x=-WORLD_SIZE;
    x<=WORLD_SIZE;
    x++
){

    for(
        let z=-WORLD_SIZE;
        z<=WORLD_SIZE;
        z++
    ){

        createBlock(
            x,
            0,
            z
        );

        createBlock(
            x,
            -1,
            z
        );

        createBlock(
            x,
            -2,
            z
        );

    }
}


/* =====================================================
                    JUGADOR
===================================================== */

const PLAYER_WIDTH = 0.58;

const PLAYER_HEIGHT = 1.80;

const PLAYER_RADIUS =
    PLAYER_WIDTH / 2;


/*
    La posición de la cámara
    es la cabeza.

    Los pies están 1.8 bloques
    debajo.
*/


function getPlayerBox(
    pos
){

    return {

        minX:
            pos.x -
            PLAYER_RADIUS +
            0.002,

        maxX:
            pos.x +
            PLAYER_RADIUS -
            0.002,

        minY:
            pos.y -
            PLAYER_HEIGHT +
            0.002,

        maxY:
            pos.y -
            0.002,

        minZ:
            pos.z -
            PLAYER_RADIUS +
            0.002,

        maxZ:
            pos.z +
            PLAYER_RADIUS -
            0.002

    };
}


/* =====================================================
              COLISIÓN CON BLOQUES
===================================================== */

function playerCollides(
    pos
){

    const box =
        getPlayerBox(pos);

    const minX =
        Math.floor(box.minX);

    const maxX =
        Math.floor(box.maxX);

    const minY =
        Math.floor(box.minY);

    const maxY =
        Math.floor(box.maxY);

    const minZ =
        Math.floor(box.minZ);

    const maxZ =
        Math.floor(box.maxZ);


    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let y=minY;
            y<=maxY;
            y++
        ){

            for(
                let z=minZ;
                z<=maxZ;
                z++
            ){

                if(
                    !blocks.has(
                        blockKey(
                            x,
                            y,
                            z
                        )
                    )
                ){
                    continue;
                }


                /*
                    Intersección REAL
                    de las dos cajas.
                */

                const hitX =
                    box.maxX > x &&
                    box.minX < x + 1;

                const hitY =
                    box.maxY > y &&
                    box.minY < y + 1;

                const hitZ =
                    box.maxZ > z &&
                    box.minZ < z + 1;


                if(
                    hitX &&
                    hitY &&
                    hitZ
                ){

                    return true;

                }

            }
        }
    }

    return false;
}


/* =====================================================
          MOVIMIENTO CON COLISIÓN POR PASOS
===================================================== */

let grounded = false;

let velocityY = 0;

const GRAVITY = 22;

const JUMP_POWER = 8.5;

const SPEED = 5.5;


function movePlayer(
    dx,
    dy,
    dz
){

    const p =
        camera.position;


    /*
        El movimiento se divide
        en pasos de máximo 0.025.

        Esto evita atravesar bloques.
    */

    const distance =
        Math.max(
            Math.abs(dx),
            Math.abs(dy),
            Math.abs(dz)
        );

    const steps =
        Math.max(
            1,
            Math.ceil(
                distance / 0.025
            )
        );


    const sx =
        dx / steps;

    const sy =
        dy / steps;

    const sz =
        dz / steps;


    let landed = false;


    for(
        let i=0;
        i<steps;
        i++
    ){

        /* =========================
                    X
        ========================= */

        if(
            sx !== 0
        ){

            const test =
                p.clone();

            test.x += sx;

            if(
                !playerCollides(test)
            ){

                p.x =
                    test.x;

            }

        }


        /* =========================
                    Z
        ========================= */

        if(
            sz !== 0
        ){

            const test =
                p.clone();

            test.z += sz;

            if(
                !playerCollides(test)
            ){

                p.z =
                    test.z;

            }

        }


        /* =========================
                    Y
        ========================= */

        if(
            sy !== 0
        ){

            const test =
                p.clone();

            test.y += sy;


            if(
                !playerCollides(test)
            ){

                p.y =
                    test.y;

            }
            else{

                if(
                    sy < 0
                ){

                    landed = true;

                }

                velocityY = 0;

                break;

            }

        }

    }


    grounded =
        landed;

}


/* =====================================================
                      TECLADO
===================================================== */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;


        if(
            e.code === "Space"
        ){

            e.preventDefault();


            if(
                grounded &&
                !dead
            ){

                velocityY =
                    JUMP_POWER;

                grounded = false;

            }

        }


        /*
            F = comer
        */

        if(
            e.code === "KeyF" &&
            !dead
        ){

            if(
                food < 10
            ){

                food++;

                updateHUD();

            }

        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[e.code] = false;

    }
);


/* =====================================================
                  VIDA Y COMIDA
===================================================== */

let health = 10;

let food = 10;

let dead = false;

let hungerTimer = 0;

const HUNGER_TIME = 15;


function updateHUD(){

    let hearts = "";

    for(
        let i=0;
        i<10;
        i++
    ){

        hearts +=
            i < health
            ? "❤️"
            : "🖤";

    }


    let foodText = "";

    for(
        let i=0;
        i<10;
        i++
    ){

        foodText +=
            i < food
            ? "🍗"
            : "🖤";

    }


    document.getElementById(
        "health"
    ).textContent =
        hearts;


    document.getElementById(
        "food"
    ).textContent =
        foodText;

}


updateHUD();


function die(
    message
){

    if(dead){
        return;
    }

    dead = true;

    controls.unlock();

    document.getElementById(
        "reason"
    ).textContent =
        message;

    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


function respawn(){

    health = 10;

    food = 10;

    dead = false;

    hungerTimer = 0;

    velocityY = 0;

    grounded = true;


    /*
        Suelo:
        bloque 0 tiene techo en Y=1.

        Cabeza:
        1 + 1.8 = 2.8
    */

    camera.position.set(
        0.5,
        2.81,
        8.5
    );


    updateHUD();


    document.getElementById(
        "death"
    ).style.display =
        "none";

    controls.lock();

}


/* =====================================================
                    HOTBAR
===================================================== */

const hotbar =
    document.getElementById(
        "hotbar"
    );


for(
    let i=0;
    i<6;
    i++
){

    const slot =
        document.createElement(
            "div"
        );

    slot.className =
        "slot";


    if(i===0){

        slot.classList.add(
            "selected"
        );

    }


    const icon =
        document.createElement(
            "div"
        );

    icon.className =
        "blockIcon";


    const num =
        document.createElement(
            "div"
        );

    num.className =
        "num";

    num.textContent =
        i + 1;


    slot.appendChild(icon);

    slot.appendChild(num);

    hotbar.appendChild(slot);

}


/* =====================================================
                SELECCIÓN DE BLOQUE
===================================================== */

let selectedBlock = 0;


window.addEventListener(
    "keydown",
    e => {

        if(
            e.code.startsWith(
                "Digit"
            )
        ){

            const n =
                Number(
                    e.code.substring(5)
                );


            if(
                n >= 1 &&
                n <= 6
            ){

                selectedBlock =
                    0;


                Array.from(
                    hotbar.children
                ).forEach(
                    (slot,i) => {

                        slot.classList.toggle(
                            "selected",
                            i === n - 1
                        );

                    }
                );

            }

        }

    }
);


/* =====================================================
              ROMPER Y COLOCAR
===================================================== */

const raycaster =
    new THREE.Raycaster();


function getTarget(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );


    const hit =
        raycaster.intersectObjects(
            Array.from(
                meshes.values()
            ),
            false
        );


    if(
        hit.length &&
        hit[0].distance <= 7
    ){

        return hit[0];

    }

    return null;
}


window.addEventListener(
    "mousedown",
    e => {

        if(
            !controls.isLocked ||
            dead
        ){
            return;
        }


        const hit =
            getTarget();


        if(!hit){
            return;
        }


        const b =
            hit.object.userData;


        /* =========================
                 ROMPER
        ========================= */

        if(
            e.button === 0
        ){

            /*
                No romper el bloque
                que sostiene al jugador.
            */

            const feetY =
                camera.position.y -
                PLAYER_HEIGHT;


            if(
                b.y <
                Math.floor(
                    feetY
                )
            ){

                removeBlock(
                    b.x,
                    b.y,
                    b.z
                );

            }

        }


        /* =========================
                 COLOCAR
        ========================= */

        if(
            e.button === 2
        ){

            const normal =
                hit.face.normal;


            const x =
                b.x +
                Math.round(
                    normal.x
                );

            const y =
                b.y +
                Math.round(
                    normal.y
                );

            const z =
                b.z +
                Math.round(
                    normal.z
                );


            const key =
                blockKey(
                    x,
                    y,
                    z
                );


            if(
                blocks.has(key)
            ){
                return;
            }


            /*
                Crear temporalmente
                para comprobar colisión.
            */

            blocks.set(
                key,
                "dirt"
            );


            const collision =
                playerCollides(
                    camera.position
                );


            blocks.delete(key);


            if(
                !collision
            ){

                createBlock(
                    x,
                    y,
                    z
                );

            }

        }

    }
);


window.addEventListener(
    "contextmenu",
    e => {

        e.preventDefault();

    }
);


/* =====================================================
                  BOTONES
===================================================== */

document.getElementById(
    "play"
).addEventListener(
    "click",
    () => {

        controls.lock();

    }
);


document.getElementById(
    "respawn"
).addEventListener(
    "click",
    () => {

        respawn();

    }
);


/* =====================================================
                  HAMBRE
===================================================== */

function updateHunger(
    delta
){

    hungerTimer +=
        delta;


    if(
        hungerTimer >=
        HUNGER_TIME
    ){

        hungerTimer = 0;


        if(
            food > 0
        ){

            food--;

            updateHUD();

        }


        /*
            Al llegar a 0:
            MUERE.
        */

        if(
            food <= 0
        ){

            die(
                "Te quedaste sin comida."
            );

        }

    }

}


/* =====================================================
                     MOVIMIENTO
===================================================== */

function updateMovement(
    delta
){

    if(
        !controls.isLocked ||
        dead
    ){
        return;
    }


    let forward = 0;

    let right = 0;


    if(keys.KeyW)
        forward += 1;

    if(keys.KeyS)
        forward -= 1;

    if(keys.KeyD)
        right += 1;

    if(keys.KeyA)
        right -= 1;


    const direction =
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    direction.y = 0;


    if(
        direction.lengthSq() > 0
    ){

        direction.normalize();

    }


    const rightVector =
        new THREE.Vector3();


    rightVector.crossVectors(
        direction,
        camera.up
    );


    rightVector.normalize();


    const movement =
        new THREE.Vector3();


    movement.addScaledVector(
        direction,
        forward
    );


    movement.addScaledVector(
        rightVector,
        right
    );


    if(
        movement.lengthSq() > 0
    ){

        movement.normalize();

        movement.multiplyScalar(
            SPEED * delta
        );

    }


    /*
        Gravedad
    */

    velocityY -=
        GRAVITY * delta;


    const dy =
        velocityY * delta;


    grounded = false;


    movePlayer(
        movement.x,
        dy,
        movement.z
    );


    /*
        Caída al vacío.
    */

    if(
        camera.position.y < -15
    ){

        die(
            "Caíste al vacío."
        );

    }


    /*
        Coordenadas.
    */

    document.getElementById(
        "coords"
    ).textContent =
        Math.floor(
            camera.position.x
        ) +
        " " +
        Math.floor(
            camera.position.y
        ) +
        " " +
        Math.floor(
            camera.position.z
        );

}


/* =====================================================
                  DÍA / NOCHE
===================================================== */

let time = 0;


function updateDayNight(
    delta
){

    time +=
        delta * 0.03;


    const sunX =
        Math.cos(time) * 50;

    const sunY =
        Math.sin(time) * 50 + 20;


    sun.position.set(
        sunX,
        sunY,
        20
    );


    const brightness =
        Math.max(
            0.18,
            Math.sin(time) * 0.5 + 0.5
        );


    scene.background =
        new THREE.Color(
            0x87ceeb
        );


    light.intensity =
        0.7 + brightness;


    sun.intensity =
        0.5 + brightness * 1.5;

}


/* =====================================================
                     INICIO
===================================================== */

camera.position.set(
    0.5,
    2.81,
    8.5
);


/* =====================================================
                    ANIMACIÓN
===================================================== */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updateMovement(
        delta
    );


    updateHunger(
        delta
    );


    updateDayNight(
        delta
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
                    RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
