<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 10 Pro Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-image: url('https://imgur.com'); /* Fondo Windows 10 */
            background-size: cover;
            background-position: center;
        }
        /* Barra de tareas */
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .start-btn {
            width: 48px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .start-btn:hover { background-color: rgba(255,255,255,0.1); }
        .start-btn svg { width: 16px; height: 16px; fill: white; }
        
        /* Bandeja del sistema (System Tray) */
        .system-tray {
            display: flex;
            align-items: center;
            height: 100%;
            padding-right: 10px;
            color: white;
            font-size: 12px;
        }
        .tray-icon {
            padding: 0 8px;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }
        .tray-icon:hover { background-color: rgba(255,255,255,0.1); }
        
        /* Reloj */
        .clock-widget {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0 10px;
            cursor: pointer;
        }
        .clock-widget:hover { background-color: rgba(255,255,255,0.1); }

        /* Submenús interactivos */
        .popover {
            position: absolute;
            bottom: 50px;
            right: 10px;
            background: rgba(28, 28, 28, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 15px;
            border-radius: 4px;
            display: none;
            width: 280px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        .popover h4 { margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .popover p { font-size: 13px; margin: 5px 0; }

        /* Pantalla de carga inicial */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 100000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 36px; height: 36px;
            border-radius: 50%;
            border-left-color: #0078d7;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Pantalla de Arranque (Boot) -->
    <div id="boot-screen">
        <svg width="80" height="80" viewBox="0 0 100 100" fill="#0078d7">
            <path d="M0 12.2L43.4 6.2V46H0V12.2z M0 54h43.4v39.8L0 87.8V54z M50 5.3L100 0v46H50V5.3z M100 54v46L50 94.7V54H100z"/>
        </svg>
        <div class="spinner"></div>
    </div>

    <!-- Escritorio -->
    <div id="desktop"></div>

    <!-- Barra de tareas -->
    <div id="taskbar">
        <div class="start-btn" id="startBtn">
            <!-- Icono Windows -->
            <svg viewBox="0 0 24 24"><path d="M0 3.449L9.75 2.1v9.45H0V3.449zM0 12.45h9.75v9.45L0 20.551v-8.102zM10.95 1.95L24 0v11.55H10.95V1.95zM10.95 12.45H24v11.55l-13.05-1.95v-9.6z"/></svg>
        </div>

        <div class="system-tray">
            <!-- Icono Wi-Fi -->
            <div class="tray-icon" onclick="togglePopover('wifi-popover')">
                <span id="wifi-icon">📡</span>
            </div>
            <!-- Icono Batería -->
            <div class="tray-icon" onclick="togglePopover('battery-popover')">
                <span id="battery-icon">🔋</span>
            </div>
            <!-- Reloj / Fecha -->
            <div class="clock-widget">
                <span id="taskbar-time">00:00</span>
                <span id="taskbar-date">01/01/2026</span>
            </div>
        </div>
    </div>

    <!-- Popover de Wi-Fi -->
    <div id="wifi-popover" class="popover">
        <h4>Red e Internet (Wi-Fi Real)</h4>
        <p id="wifi-status">Detectando estado...</p>
        <p style="color: #888; font-size: 11px; margin-top: 10px;">Desconecta el Wi-Fi de tu laptop para ver el cambio reflejado en tiempo real.</p>
    </div>

    <!-- Popover de Batería -->
    <div id="battery-popover" class="popover">
        <h4>Estado de la Batería</h4>
        <p id="battery-status">Cargando telemetría de hardware...</p>
        <p id="battery-charging"></p>
    </div>

    <script>
        // Simulación de pantalla de carga inicial
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
            }, 2500);
            actualizarReloj();
            setInterval(actualizarReloj, 1000);
            inicializarHardware();
        });

        // Reloj de la barra de tareas
        function actualizarReloj() {
            const ahora = new Date();
            let horas = ahora.getHours();
            let minutos = ahora.getMinutes();
            let dia = ahora.getDate();
            let mes = ahora.getMonth() + 1;
            let anio = ahora.getFullYear();

            horas = horas < 10 ? '0' + horas : horas;
            minutos = minutos < 10 ? '0' + minutos : minutos;
            dia = dia < 10 ? '0' + dia : dia;
            mes = mes < 10 ? '0' + mes : mes;

            document.getElementById('taskbar-time').innerText = `${horas}:${minutos}`;
            document.getElementById('taskbar-date').innerText = `${dia}/${mes}/${anio}`;
        }

        // Alternar menús de la barra de tareas
        function togglePopover(id) {
            const popover = document.getElementById(id);
            const estaAbierto = popover.style.display === 'block';
            
            // Cerrar todos los menús abiertos antes
            document.querySelectorAll('.popover').forEach(p => p.style.style.display = 'none');
            
            if (!estaAbierto) {
                popover.style.display = 'block';
            } else {
                popover.style.display = 'none';
            }
        }

        // Integración de API de Hardware Real (Wi-Fi y Batería)
        function inicializarHardware() {
            // 1. Wi-Fi Real utilizando la API del Navegador Network Information
            function verificarConexion() {
                const online = navigator.onLine;
                const statusTxt = document.getElementById('wifi-status');
                const icon = document.getElementById('wifi-icon');
                
                if (online) {
                    statusTxt.innerText = "Conectado a internet (Acceso Seguro)";
                    icon.innerText = "📶";
                } else {
                    statusTxt.innerText = "Desconectado - Sin acceso a la red";
                    icon.innerText = "❌";
                }
            }
            window.addEventListener('online', verificarConexion);
            window.addEventListener('offline', verificarConexion);
            verificarConexion();

            // 2. Emulador y Monitor de Batería Real de Laptop
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(battery) {
                    function updateBatteryInfo() {
                        const porcentaje = Math.round(battery.level * 100);
                        document.getElementById('battery-status').innerText = `Nivel de carga: ${porcentaje}%`;
                        document.getElementById('battery-charging').innerText = battery.charging ? "🔌 Cargando actualmente" : "🔋 Descargando (Uso de batería)";
                        
                        const icon = document.getElementById('battery-icon');
                        if(battery.charging) icon.innerText = "⚡🔋";
                        else if(porcentaje > 50) icon.innerText = "🔋";
                        else icon.innerText = "🪫";
                    }
                    
                    updateBatteryInfo();
                    battery.addEventListener('levelchange', updateBatteryInfo);
                    battery.addEventListener('chargingchange', updateBatteryInfo);
                });
            } else {
                // Caída (Fallback) si el navegador bloquea la lectura directa
                document.getElementById('battery-status').innerText = "Batería Emulada: 85% disponible";
                document.getElementById('battery-charging').innerText = "🔋 Ejecutándose en Corriente Alterna";
            }
        }

        // Cerrar menús al hacer clic en el escritorio
        document.getElementById('desktop').addEventListener('click', () => {
