<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 10 Pro Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 80% 50%, #175e9b 0%, #002e62 70%);
        }
        
        /* Escritorio */
        #desktop {
            width: 100%;
            height: calc(100% - 40px);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: flex-start;
        }

        .desktop-icon {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            padding: 5px;
            border: 1px solid transparent;
            border-radius: 3px;
        }
        .desktop-icon:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .desktop-icon span.icon-img { font-size: 32px; margin-bottom: 5px; }
        .desktop-icon span.icon-text { color: white; font-size: 11px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        /* Ventanas */
        .window {
            position: absolute;
            top: 80px;
            left: 120px;
            width: 450px;
            height: 300px;
            background-color: #ffffff;
            border: 1px solid #1c1c1c;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        .window-header {
            background-color: #efefef;
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 10px;
            cursor: move;
            border-bottom: 1px solid #d1d1d1;
        }
        .window-title { font-size: 12px; color: #333333; }
        .window-controls { display: flex; height: 100%; }
        .win-btn {
            width: 45px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
        }
        .win-btn:hover { background-color: #e5e5e5; }
        .win-btn.close:hover { background-color: #e81123; color: white; }
        .window-content { padding: 15px; flex: 1; font-size: 14px; color: #333; }

        /* NUEVO MENÚ DE INICIO REAL DE WINDOWS 10 */
        #start-menu {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 620px;
            height: 500px;
            background-color: rgba(25, 25, 25, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 10000;
            display: none;
            grid-template-columns: 45px 225px 1fr;
        }

        /* Barra de opciones izquierda (Apagar, Config) */
        .start-sidebar {
            background-color: rgba(10, 10, 10, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10px;
            gap: 15px;
        }
        .sidebar-icon { color: #ccc; font-size: 18px; cursor: pointer; padding: 10px; width: 100%; text-align: center; }
        .sidebar-icon:hover { background-color: rgba(255,255,255,0.1); color: white; }

        /* Lista de aplicaciones del medio */
        .start-apps-list {
            padding: 15px 10px;
            overflow-y: auto;
            color: #ddd;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .app-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px;
            cursor: pointer;
            border-radius: 2px;
        }
        .app-item:hover { background-color: rgba(255,255,255,0.1); }
        .app-icon-small { font-size: 16px; }

        /* Panel de mosaicos de la derecha (Tiles) */
        .start-tiles-grid {
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 90px;
            gap: 8px;
        }
        .tile {
            background-color: #0078d7;
            color: white;
            padding: 10px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .tile:hover { transform: scale(0.98); filter: brightness(1.1); }
        .tile.wide { grid-column: span 2; background-color: #d83b01; }
        .tile.green { background-color: #107c41; }
        .tile-icon { font-size: 24px; }

        /* Barra de tareas */
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .start-btn { width: 48px; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .start-btn:hover { background-color: rgba(255,255,255,0.1); }
        .start-btn svg { width: 16px; height: 16px; fill: white; }
        
        .system-tray { display: flex; align-items: center; height: 100%; padding-right: 10px; color: white; font-size: 12px; }
        .tray-icon { padding: 0 12px; height: 100%; display: flex; align-items: center; cursor: pointer; }
        .tray-icon:hover { background-color: rgba(255,255,255,0.1); }
        .clock-widget { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding: 0 10px; height: 100%; cursor: pointer; }
        .clock-widget:hover { background-color: rgba(255,255,255,0.1); }

        .popover {
            position: absolute;
            bottom: 45px;
            right: 10px;
            background: rgba(28, 28, 28, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 15px;
            border-radius: 2px;
            display: none;
            width: 290px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            z-index: 10000;
        }
    </style>
</head>
<body>

    <!-- Escritorio -->
    <div id="desktop">
        <div class="desktop-icon" ondblclick="openWindow('win-pc')" onclick="event.stopPropagation()">
            <span class="icon-img">🖥️</span>
            <span class="icon-text">Este Equipo</span>
        </div>
        <div class="desktop-icon" ondblclick="openWindow('win-notes')" onclick="event.stopPropagation()">
            <span class="icon-img">📝</span>
            <span class="icon-text">Notas Pro</span>
        </div>
    </div>

    <!-- Menú de Inicio Adaptado Real de la Imagen -->
    <div id="start-menu" onclick="event.stopPropagation()">
        <!-- Barra Lateral Izquierda -->
        <div class="start-sidebar">
            <div class="sidebar-icon" title="Usuario">👤</div>
            <div class="sidebar-icon" title="Configuración">⚙️</div>
            <div class="sidebar-icon" title="Apagar" onclick="location.reload()"> Telling ⚙️</div>
        </div>

        <!-- Lista Central de Aplicaciones -->
        <div class="start-apps-list">
            <div style="color: #666; font-size: 11px; font-weight: bold; padding-left: 5px;">Más usadas</div>
            <div class="app-item" onclick="openWindow('win-pc'); toggleStartMenu(event)">
                <span class="app-icon-small">🖥️</span> <span>Este Equipo</span>
            </div>
            <div class="app-item" onclick="openWindow('win-notes'); toggleStartMenu(event)">
                <span class="app-icon-small">📝</span> <span>Notas Pro</span>
            </div>
            <div class="app-item"><span class="app-icon-small">🌐</span> <span>Microsoft Edge</span></div>
            <div class="app-item"><span class="app-icon-small">📁</span> <span>Explorador de archivos</span></div>
        </div>

        <!-- Cuadrícula de Mosaicos de la Derecha (Tiles) -->
        <div class="start-tiles-grid">
            <div class="tile wide">
                <span class="tile-icon">📅</span>
                <span>Calendario de Outlook</span>
            </div>
            <div class="tile green">
                <span class="tile-icon">🎮</span>
                <span>Candy Crush</span>
            </div>
            <div class="tile">
                <span class="tile-icon">☁️</span>
                <span>El Tiempo - 24°C</span>
            </div>
            <div class="tile">
                <span class="tile-icon">🛒</span>
                <span>Microsoft Store</span>
            </div>
        </div>
    </div>

    <!-- Ventanas -->
    <div id="win-pc" class="window" onclick="focusWindow('win-pc')">
