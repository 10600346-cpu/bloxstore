<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 10 Pro Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-image: url('https://imgur.com'); /* Fondo Windows 10 */
            background-size: cover;
            background-position: center;
            background-color: #0078d7;
        }
        
        /* Contenedor del Escritorio */
        #desktop {
            width: 100%;
            height: calc(100% - 40px);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Barra de tareas */
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .start-btn {
            width: 48px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .start-btn:hover { background-color: rgba(255,255,255,0.1); }
        .start-btn svg { width: 16px; height: 16px; fill: white; }
        
        /* Bandeja del sistema */
        .system-tray {
            display: flex;
            align-items: center;
            height: 100%;
            padding-right: 10px;
            color: white;
            font-size: 12px;
        }
        .tray-icon {
            padding: 0 12px;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }
        .tray-icon:hover { background-color: rgba(255,255,255,0.1); }
        
        /* Reloj */
        .clock-widget {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            padding: 0 10px;
            height: 100%;
            cursor: pointer;
        }
        .clock-widget:hover { background-color: rgba(255,255,255,0.1); }

        /* Submenús interactivos (Popovers) */
        .popover {
            position: absolute;
            bottom: 45px;
            right: 10px;
            background: rgba(28, 28, 28, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 15px;
            border-radius: 2px;
            display: none;
            width: 290px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            z-index: 10000;
        }
        .popover h4 { margin-bottom: 10px; font-size: 13px; border-bottom: 1px solid #444; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .popover p { font-size: 12px; margin: 6px 0; }

        /* Pantalla de carga inicial fija */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 100000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            width: 40px; height: 40px;
            border-radius: 50%;
            border-left-color: #ffffff;
            animation: spin 1.2s linear infinite;
            margin-top: 60px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Pantalla de Arranque (Boot) -->
    <div id="boot-screen">
        <svg width="100" height="100" viewBox="0 0 100 100" fill="#ffffff">
            <path d="M0 12.2L43.4 6.2V46H0V12.2z M0 54h43.4v39.8L0 87.8V54z M50 5.3L100 0v46H50V5.3z M100 54v46L50 94.7V54H100z"/>
        </svg>
        <div class="spinner"></div>
    </div>

    <!-- Escritorio interactivo -->
    <div id="desktop"></div>

    <!-- Barra de tareas -->
    <div id="taskbar">
        <div class="start-btn" id="startBtn">
            <svg viewBox="0 0 24 24"><path d="M0 3.449L9.75 2.1v9.45H0V3.449zM0 12.45h9.75v9.45L0 20.551v-8.102zM10.95 1.95L24 0v11.55H10.95V1.95zM10.95 12.45H24v11.55l-13.05-1.95v-9.6z"/></svg>
        </div>

        <div class="system-tray">
            <!-- Icono Wi-Fi -->
            <div class="tray-icon" onclick="togglePopover(event, 'wifi-popover')">
                <span id="wifi-icon">📶</span>
            </div>
            <!-- Icono Batería -->
            <div class="tray-icon" onclick="togglePopover(event, 'battery-popover')">
                <span id="battery-icon">🔋</span>
            </div>
            <!-- Reloj / Fecha -->
            <div class="clock-widget">
                <span id="taskbar-time">00:00</span>
                <span id="taskbar-date">01/01/2026</span>
            </div>
        </div>
    </div>

    <!-- Popover de Wi-Fi -->
    <div id="wifi-popover" class="popover">
        <h4>Red e Internet</h4>
        <p id="wifi-status">Detectando adaptador de red...</p>
    </div>

    <!-- Popover de Batería -->
    <div id="battery-popover" class="popover">
        <h4>Batería y Sistema</h4>
        <p id="battery-status">Sincronizando telemetría...</p>
        <p id="battery-charging"></p>
    </div>

    <script>
        // Remueve la pantalla de carga de forma segura a los 3 segundos
        setTimeout(function() {
            var bootScreen = document.getElementById('boot-screen');
            if (bootScreen) {
                bootScreen.style.opacity = '0';
                setTimeout(function() {
                    bootScreen.style.display = 'none';
                }, 500);
            }
        }, 3000);

        // Reloj del sistema corregido por completo
        function actualizarReloj() {
            var ahora = new Date();
            var horas = ahora.getHours();
            var minutos = ahora.getMinutes();
            var dia = ahora.getDate();
            var mes = ahora.getMonth() + 1;
            var anio = ahora.getFullYear();

            horas = horas < 10 ? '0' + horas : horas;
            minutos = minutos < 10 ? '0' + minutos : minutos;
            dia = dia < 10 ? '0' + dia : dia;
            mes = mes < 10 ? '0' + mes : mes;

            var timeEl = document.getElementById('taskbar-time');
            var dateEl = document.getElementById('taskbar-date');
            if (timeEl) timeEl.innerText = horas + ':' + minutos;
            if (dateEl) dateEl.innerText = dia + '/' + mes + '/' + anio;
        }
        
        actualizarReloj();
        setInterval(actualizarReloj, 1000);

        // Alternar paneles de Wi-Fi y Batería
        function togglePopover(event, id) {
            if (event) event.stopPropagation();
            var popover = document.getElementById(id);
            if (!popover) return;
            
            var estaAbierto = popover.style.display === 'block';
            cerrarTodosLosPopovers();
            
            if (!estaAbierto) {
                popover.style.display = 'block';
            }
        }

        function cerrarTodosLosPopovers() {
            var popovers = document.querySelectorAll('.popover');
            for (var i = 0; i < popovers.length; i++) {
                popovers[i].style.display = 'none';
            }
        }

        document.getElementById('desktop').addEventListener('click', cerrarTodosLosPopovers);
        document.getElementById('startBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            alert("Menú de Inicio de Windows 10 Pro cargado.");
        });

        // Verificación básica del estado de red
        function verificarConexion() {
            var online = navigator.onLine;
            var statusTxt = document.getElementById('wifi-status');
            var icon = document.getElementById('wifi-icon');
            if (statusTxt && icon) {
                if (online) {
                    statusTxt.innerText = "Conectado a Internet (Acceso Seguro Windows)";
                    icon.innerText = "📶";
                } else {
                    statusTxt.innerText = "Desconectado - Sin acceso a la red";
                    icon.innerText = "❌";
                }
            }
        }
        window.addEventListener('online', verificarConexion);
        window.addEventListener('offline', verificarConexion);
        verificarConexion();
    </script>
</body>
</html>
