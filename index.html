<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockWorld</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#79c8ff;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#cross{
    position:fixed;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
    z-index:5;
    pointer-events:none;
}

#cross:before,
#cross:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 2px #000;
}

#cross:before{
    width:2px;
    height:18px;
    left:9px;
    top:1px;
}

#cross:after{
    height:2px;
    width:18px;
    left:1px;
    top:9px;
}

#hud{
    position:fixed;
    inset:0;
    color:white;
    text-shadow:2px 2px 3px #000;
    pointer-events:none;
    z-index:4;
}

#stats{
    position:absolute;
    top:12px;
    left:14px;
    font-size:18px;
    line-height:27px;
}

#help{
    position:absolute;
    bottom:86px;
    left:0;
    width:100%;
    text-align:center;
    font-size:14px;
}

#message{
    position:absolute;
    right:15px;
    top:15px;
    text-align:right;
    max-width:350px;
}

#hotbar{
    position:absolute;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
    pointer-events:auto;
}

.slot{
    width:58px;
    height:58px;
    background:#222c;
    border:3px solid #555;
    text-align:center;
    position:relative;
    cursor:pointer;
}

.slot.selected{
    border-color:white;
}

.slot .icon{
    font-size:26px;
    margin-top:9px;
}

.slot .n{
    position:absolute;
    left:3px;
    top:1px;
    font-size:12px;
}

.slot .c{
    position:absolute;
    right:4px;
    bottom:2px;
    font-weight:bold;
}

#inventory{
    display:none;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(650px,94vw);
    background:#252525ed;
    border:4px solid #777;
    padding:18px;
    pointer-events:auto;
}

#inventory h2{
    text-align:center;
    margin:0 0 15px;
}

#items{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.item{
    height:65px;
    border:2px solid #666;
    background:#111;
    text-align:center;
    position:relative;
}

.item .icon{
    font-size:25px;
}

.item .c{
    position:absolute;
    right:4px;
    bottom:3px;
}

#error{
    display:none;
    position:fixed;
    inset:0;
    background:#111;
    color:white;
    padding:30px;
    font:18px monospace;
    z-index:99;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="cross"></div>

<div id="hud">

    <div id="stats">
        ❤️ <span id="hp">20</span>/20<br>
        🍖 <span id="food">20</span>/20
    </div>

    <div id="message"></div>

    <div id="help">
        WASD mover · ESPACIO saltar · SHIFT correr ·
        Clic romper · Clic derecho colocar · E inventario · 1-9 bloques
    </div>

    <div id="hotbar"></div>

    <div id="inventory">
        <h2>INVENTARIO</h2>
        <div id="items"></div>
    </div>

</div>

<div id="error"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

(() => {

"use strict";

const errorBox=document.getElementById("error");

function fatal(e){

    errorBox.style.display="block";

    errorBox.innerHTML=
        "<h2>No se pudo iniciar el juego</h2>"+
        "<p>"+String(e).replace(/[<>&]/g,m=>({
            "<":"&lt;",
            ">":"&gt;",
            "&":"&amp;"
        }[m]))+"</p>"+
        "<p>Comprueba que GitHub Pages tenga Internet habilitado y recarga la página.</p>";
}

if(!window.THREE){

    fatal("Three.js no pudo cargarse desde el CDN.");

    return;
}

const canvas=document.getElementById("game");

const renderer=
    new THREE.WebGLRenderer({
        canvas:canvas,
        antialias:false
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

const scene=new THREE.Scene();

scene.background=
    new THREE.Color(0x78c8ff);

scene.fog=
    new THREE.Fog(
        0x78c8ff,
        25,
        95
    );

const camera=
    new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .05,
        160
    );

const light=
    new THREE.HemisphereLight(
        0xcceeff,
        0x59604a,
        1.35
    );

scene.add(light);

const sun=
    new THREE.DirectionalLight(
        0xffffff,
        1
    );

sun.position.set(
    30,
    60,
    20
);

scene.add(sun);


/* =========================
   BLOQUES
========================= */

const TYPES={

    grass:{
        name:"Pasto",
        color:0x58a83c,
        hard:1
    },

    dirt:{
        name:"Tierra",
        color:0x805b3c,
        hard:1
    },

    stone:{
        name:"Piedra",
        color:0x858585,
        hard:3
    },

    sand:{
        name:"Arena",
        color:0xd7c17b,
        hard:1
    },

    wood:{
        name:"Madera",
        color:0x956338,
        hard:2
    },

    leaves:{
        name:"Hojas",
        color:0x328d3b,
        hard:.5,
        transparent:true
    },

    coal:{
        name:"Carbón",
        color:0x303030,
        hard:4
    },

    iron:{
        name:"Hierro",
        color:0xaaa9a0,
        hard:4
    },

    gold:{
        name:"Oro",
        color:0xd5b52e,
        hard:5
    },

    diamond:{
        name:"Diamante",
        color:0x32ced8,
        hard:5
    },

    bedrock:{
        name:"Roca madre",
        color:0x252525,
        hard:999
    }

};

const ICON={

    grass:"🟩",
    dirt:"🟫",
    stone:"⬜",
    sand:"🟨",
    wood:"🪵",
    leaves:"🍃",
    coal:"⚫",
    iron:"⚙️",
    gold:"🟨",
    diamond:"💎",
    bedrock:"⬛"

};


/* =========================
   MUNDO
========================= */

const world=new Map();

const meshes=new Map();

const K=(x,y,z)=>
    x+","+y+","+z;

const get=(x,y,z)=>
    world.get(K(x,y,z));

function setB(x,y,z,t){

    if(y<0)return;

    if(t)
        world.set(K(x,y,z),t);
    else
        world.delete(K(x,y,z));
}

function solid(x,y,z){

    const t=get(x,y,z);

    return !!t &&
        !TYPES[t].transparent;
}

function noise(x,z){

    return (
        Math.sin(
            x*12.9898+
            z*78.233
        )*43758.5453
    )%1;
}

function height(x,z){

    return Math.max(
        3,
        Math.floor(
            7+
            Math.sin(x*.16)*2+
            Math.cos(z*.13)*2+
            Math.sin((x+z)*.06)*3
        )
    );

}


/* =========================
   ÁRBOLES
========================= */

function tree(x,y,z){

    const h=5;

    for(let i=0;i<h;i++)
        setB(x,y+i,z,"wood");

    for(
        let dx=-2;
        dx<=2;
        dx++
    )

    for(
        let dz=-2;
        dz<=2;
        dz++
    )

    for(
        let dy=3;
        dy<=6;
        dy++
    ){

        if(
            Math.abs(dx)+
            Math.abs(dz)+
            (dy>5?1:0)<=4
        ){

            setB(
                x+dx,
                y+dy,
                z+dz,
                "leaves"
            );

        }

    }

}


/* =========================
   GENERAR TERRENO
========================= */

for(
    let x=-28;
    x<=28;
    x++
)

for(
    let z=-28;
    z<=28;
    z++
){

    const h=height(x,z);

    for(
        let y=0;
        y<=h;
        y++
    ){

        let t;

        if(y===0)
            t="bedrock";

        else if(y===h)
            t=
                h<=5
                ?"sand"
                :"grass";

        else if(y>=h-3)
            t=
                h<=5
                ?"sand"
                :"dirt";

        else
            t="stone";

        const r=
            Math.abs(
                noise(
                    x*3+y,
                    z*5-y
                )
            );

        if(
            y>2 &&
            y<h-2
        ){

            if(r<.015)
                t="diamond";

            else if(r<.05)
                t="gold";

            else if(r<.10)
                t="iron";

            else if(r<.19)
                t="coal";

        }

        setB(
            x,
            y,
            z,
            t
        );

    }

    if(
        h>7 &&
        Math.abs(
            noise(
                x*9,
                z*11
            )
        )>.94 &&
        Math.abs(x)+Math.abs(z)>5
    ){

        tree(
            x,
            h+1,
            z
        );

    }

}


/* =========================
   RENDERIZAR BLOQUES
========================= */

const geo=
    new THREE.BoxGeometry(
        1,1,1
    );

const materials={};

for(
    const [t,v]
    of Object.entries(TYPES)
){

    materials[t]=
        new THREE.MeshLambertMaterial({

            color:v.color,

            transparent:
                !!v.transparent,

            opacity:
                v.transparent
                ? .65
                : 1

        });

}

function rebuild(){

    for(
        const m
        of meshes.values()
    )
        scene.remove(m);

    meshes.clear();

    for(
        const [k,t]
        of world
    ){

        const [
            x,
            y,
            z
        ]=
            k.split(",")
             .map(Number);

        const m=
            new THREE.Mesh(
                geo,
                materials[t]
            );

        m.position.set(
            x+.5,
            y+.5,
            z+.5
        );

        m.userData={
            x,
            y,
            z,
            t
        };

        scene.add(m);

        meshes.set(
            k,
            m
        );

    }

}

rebuild();


/* =========================
   INVENTARIO
========================= */

const inv={

    grass:4,
    dirt:8,
    stone:12,
    sand:3,
    wood:5,
    leaves:0,
    coal:0,
    iron:0,
    gold:0,
    diamond:0

};

const hot=[
    "grass",
    "dirt",
    "stone",
    "wood",
    "sand",
    "coal",
    "iron",
    "gold",
    "diamond"
];

let selected=0;


/* =========================
   JUGADOR
========================= */

const player={

    x:.5,

    y:height(0,0)+1.01,

    z:.5,

    vx:0,

    vy:0,

    vz:0,

    yaw:0,

    pitch:0,

    onGround:false,

    hp:20,

    food:20

};


/* =========================
   COLISIONES
========================= */

function collision(
    px,
    py,
    pz
){

    for(
        let x=Math.floor(px-.28);
        x<=Math.floor(px+.28);
        x++
    )

    for(
        let y=Math.floor(py);
        y<=Math.floor(py+1.79);
        y++
    )

    for(
        let z=Math.floor(pz-.28);
        z<=Math.floor(pz+.28);
        z++
    ){

        if(
            solid(
                x,
                y,
                z
            )
        )
            return true;

    }

    return false;

}

function axis(a,d){

    let x=player.x;
    let y=player.y;
    let z=player.z;

    if(a==="x")x+=d;
    if(a==="y")y+=d;
    if(a==="z")z+=d;

    if(
        !collision(
            x,
            y,
            z
        )
    ){

        player.x=x;
        player.y=y;
        player.z=z;

    }

    else{

        if(
            a==="y" &&
            d<0
        )
            player.onGround=true;

        if(a==="x")
            player.vx=0;

        if(a==="y")
            player.vy=0;

        if(a==="z")
            player.vz=0;

    }

}


/* =========================
   CONTROLES
========================= */

const held={};

addEventListener(
    "keydown",
    e=>{

        held[e.code]=true;

        if(
            e.code==="KeyE"
        ){

            const invBox=
                document.getElementById(
                    "inventory"
                );

            invBox.style.display=
                invBox.style.display==="block"
                ?"none"
                :"block";

            document.exitPointerLock?.();

        }

        if(
            /^Digit[1-9]$/.test(
                e.code
            )
        ){

            selected=
                +e.code.slice(5)-1;

            hotbar();

        }

        if(
            e.code==="Escape"
        )
            document.exitPointerLock?.();

    }
);

addEventListener(
    "keyup",
    e=>{
        held[e.code]=false;
    }
);


/* =========================
   RATÓN
========================= */

let locked=false;

canvas.addEventListener(
    "click",
    ()=>{

        if(!locked)
            canvas.requestPointerLock();

    }
);

document.addEventListener(
    "pointerlockchange",
    ()=>{
        locked=
            document.pointerLockElement
            ===canvas;
    }
);

document.addEventListener(
    "mousemove",
    e=>{

        if(!locked)return;

        player.yaw-=
            e.movementX*.0022;

        player.pitch=
            Math.max(
                -1.52,
                Math.min(
                    1.52,
                    player.pitch-
                    e.movementY*.0022
                )
            );

    }
);


/* =========================
   ROMPER / COLOCAR
========================= */

const ray=
    new THREE.Raycaster();

function target(){

    ray.setFromCamera(
        {
            x:0,
            y:0
        },
        camera
    );

    const h=
        ray.intersectObjects(
            [...meshes.values()]
        );

    if(
        !h.length ||
        h[0].distance>6
    )
        return null;

    return {

        block:
            h[0].object.userData,

        normal:
            h[0].face.normal

    };

}

addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);

addEventListener(
    "mousedown",
    e=>{

        if(!locked)return;

        const h=target();

        if(!h)return;

        if(
            e.button===0
        ){

            const b=h.block;

            if(
                b.t==="bedrock"
            )
                return;

            setB(
                b.x,
                b.y,
                b.z,
                null
            );

            if(
                inv[b.t]!=null
            )
                inv[b.t]++;

            rebuild();

            hotbar();

            beep(100);

        }

        if(
            e.button===2
        ){

            const t=
                hot[selected];

            if(!inv[t])
                return;

            const x=
                h.block.x+
                Math.round(
                    h.normal.x
                );

            const y=
                h.block.y+
                Math.round(
                    h.normal.y
                );

            const z=
                h.block.z+
                Math.round(
                    h.normal.z
                );

            if(
                y<1 ||
                get(x,y,z)
            )
                return;

            if(
                player.x>.1+x &&
                player.x<.9+x &&
                player.z>.1+z &&
                player.z<.9+z &&
                player.y<y+1.8 &&
                player.y+1.8>y
            )
                return;

            setB(
                x,
                y,
                z,
                t
            );

            inv[t]--;

            rebuild();

            hotbar();

            beep(240);

        }

    }
);


/* =========================
   HUD
========================= */

function hotbar(){

    const el=
        document.getElementById(
            "hotbar"
        );

    el.innerHTML="";

    hot.forEach(
        (t,i)=>{

            const d=
                document.createElement(
                    "div"
                );

            d.className=
                "slot"+
                (
                    i===selected
                    ?" selected"
                    :""
                );

            d.innerHTML=
                '<span class="n">'+
                (i+1)+
                '</span>'+
                '<div class="icon">'+
                ICON[t]+
                '</div>'+
                '<span class="c">'+
                (inv[t]||0)+
                '</span>';

            d.onclick=()=>{
                selected=i;
                hotbar();
            };

            el.appendChild(d);

        }
    );

}

function inventory(){

    const el=
        document.getElementById(
            "items"
        );

    el.innerHTML="";

    Object.keys(inv).forEach(
        t=>{

            const d=
                document.createElement(
                    "div"
                );

            d.className="item";

            d.innerHTML=
                '<div class="icon">'+
                ICON[t]+
                '</div>'+
                TYPES[t].name+
                '<span class="c">'+
                inv[t]+
                '</span>';

            el.appendChild(d);

        }
    );

}

hotbar();
inventory();


/* =========================
   SONIDOS
========================= */

function beep(freq){

    try{

        const a=
            new (
                window.AudioContext||
                window.webkitAudioContext
            )();

        const o=
            a.createOscillator();

        const g=
            a.createGain();

        o.frequency.value=
            freq;

        o.connect(g);

        g.connect(
            a.destination
        );

        g.gain.value=.025;

        o.start();

        o.stop(
            a.currentTime+.045
        );

    }catch(e){}

}


/* =========================
   BUCLE DEL JUEGO
========================= */

let time=0;

let last=
    performance.now();

function frame(now){

    requestAnimationFrame(
        frame
    );

    const dt=
        Math.min(
            .05,
            (now-last)/1000
        );

    last=now;


    const f=
        (held.KeyW?1:0)-
        (held.KeyS?1:0);

    const s=
        (held.KeyD?1:0)-
        (held.KeyA?1:0);

    const l=
        Math.hypot(f,s)||1;

    const speed=
        (
            held.ShiftLeft||
            held.ShiftRight
        )
        ?6.5
        :4.2;


    const sy=
        Math.sin(
            player.yaw
        );

    const cy=
        Math.cos(
            player.yaw
        );


    const tx=
        (
            -sy*f+
            cy*s
        )/l*speed;

    const tz=
        (
            -cy*f-
            sy*s
        )/l*speed;


    player.vx+=
        (
            tx-player.vx
        )*
        Math.min(
            1,
            dt*12
        );

    player.vz+=
        (
            tz-player.vz
        )*
        Math.min(
            1,
            dt*12
        );


    if(!f&&!s){

        player.vx*=.80;
        player.vz*=.80;

    }


    if(
        held.Space &&
        player.onGround
    ){

        player.vy=8;

        player.onGround=false;

    }


    player.vy-=22*dt;

    player.onGround=false;


    axis(
        "x",
        player.vx*dt
    );

    axis(
        "z",
        player.vz*dt
    );

    axis(
        "y",
        player.vy*dt
    );


    if(
        player.y<-10
    ){

        player.x=.5;

        player.z=.5;

        player.y=
            height(0,0)+1;

        player.hp=20;

        player.food=20;

    }


    camera.position.set(
        player.x,
        player.y+1.62,
        player.z
    );

    camera.rotation.set(
        player.pitch,
        player.yaw,
        0
    );


    /* DÍA / NOCHE */

    time+=dt*.025;

    const sunY=
        Math.sin(time);

    sun.position.set(
        Math.cos(time)*60,
        Math.max(
            5,
            sunY*60
        ),
        20
    );


    const day=
        Math.max(
            .15,
            sunY*.5+.5
        );

    light.intensity=
        .35+day;


    const c=
        new THREE.Color()
        .setHSL(
            .57,
            .75,
            .18+.28*day
        );


    scene.background=c;

    scene.fog.color=c;


    document.getElementById(
        "hp"
    ).textContent=
        Math.floor(
            player.hp
        );

    document.getElementById(
        "food"
    ).textContent=
        Math.floor(
            player.food
        );


    renderer.render(
        scene,
        camera
    );

}


requestAnimationFrame(
    frame
);


addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


document.getElementById(
    "message"
).textContent=
    "Haz clic para empezar";

setTimeout(
    ()=>{
        document.getElementById(
            "message"
        ).textContent="";
    },
    3000
);

})();
</script>

</body>
</html>
